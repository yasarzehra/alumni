<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | Mezun Bilgi Sistemi</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 620px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 16px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }
        .glitch-code {
            font-size: 5.5rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(to right, #f87171, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }
        .message {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .requested-path {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            color: #38bdf8;
            font-size: 0.95rem;
            margin-bottom: 32px;
            word-break: break-all;
        }
        .suggestions {
            text-align: left;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 32px;
        }
        .suggestions-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 12px;
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }
        .pill-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #334155;
            color: #f1f5f9;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .pill-link:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-1px);
        }
        .primary-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-badge">
            <span>🛡️</span> 404 GUARDIAN
        </div>
        <div class="glitch-code">404</div>
        <h1>Sayfa Bulunamadı</h1>
        <p class="message">
            Aradığınız sayfa taşınmış, silinmiş veya geçersiz bir bağlantı girilmiş olabilir.
        </p>

        <div class="requested-path" id="path-display">
            {{REQUESTED_PATH}}
        </div>

        <div class="suggestions">
            <div class="suggestions-title">Popüler Bölümler</div>
            <div class="links-grid">
                <a href="/jobs" class="pill-link">💼 İş İlanları</a>
                <a href="/users" class="pill-link">👥 Mezunlar</a>
                <a href="/applications" class="pill-link">📝 Başvurular</a>
                <a href="/announcements" class="pill-link">📢 Duyurular</a>
            </div>
        </div>

        <div class="primary-actions">
            <a href="/" class="btn btn-primary">🏠 Ana Sayfaya Git</a>
            <a href="javascript:history.back()" class="btn btn-outline">↩ Geri Dön</a>
        </div>
    </div>
</body>
</html>
