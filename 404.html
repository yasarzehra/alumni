<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | İstanbul Üniversitesi Mezun Ağı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --iu-burgundy: #881337;
            --iu-burgundy-hover: #9f1239;
            --iu-burgundy-dark: #4c0519;
            --iu-gold: #c59b27;
            --iu-gold-light: #d4af37;
            --iu-gold-glow: rgba(0, 0, 0, 0.25);
            --bg-start: #0d1525;
            --bg-end: #090e1a;
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 640px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 22px;
            padding: 50px 42px;
            text-align: center;
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--iu-burgundy), var(--iu-gold));
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(136, 19, 55, 0.25);
            color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.35);
            padding: 6px 18px;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.82rem;
            margin-bottom: 22px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .glitch-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .message {
            color: var(--text-muted);
            font-size: 1.02rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .requested-path {
            background: #080c16;
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: #d4af37;
            font-size: 0.95rem;
            margin-bottom: 28px;
            word-break: break-all;
        }
        .suggestions {
            text-align: left;
            background: rgba(8, 12, 22, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 32px;
        }
        .suggestions-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #d4af37;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }
        .pill-link {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1525;
            color: #f1f5f9;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid var(--border-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pill-link:hover {
            background: rgba(136, 19, 55, 0.3);
            color: #ffffff;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
        }
        .primary-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
        }
        .btn-burgundy {
            background: linear-gradient(135deg, var(--iu-burgundy), #6b0c2a);
            color: #ffffff;
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }
        .btn-burgundy:hover {
            background: linear-gradient(135deg, #9f1239, #881337);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 4px 14px rgba(136, 19, 55, 0.4);
        }
        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-badge">
            <span>🏛️</span> İÜ 404 GUARDIAN
        </div>
        <div class="glitch-code">404</div>
        <h1>Sayfa Bulunamadı</h1>
        <p class="message">
            Aradığınız sayfa taşınmış, silinmiş veya geçersiz bir bağlantı girilmiş olabilir.
        </p>

        <div class="requested-path" id="path-display">
            {{REQUESTED_PATH}}
        </div>

        <div class="suggestions">
            <div class="suggestions-title">Popüler Üniversite Platform Bölümleri</div>
            <div class="links-grid">
                <a href="/jobs" class="pill-link">💼 İş İlanları</a>
                <a href="/users" class="pill-link">👥 Mezun Rehberi</a>
                <a href="/applications" class="pill-link">📝 Başvurular</a>
                <a href="/announcements" class="pill-link">📢 Duyurular</a>
                <a href="/about" class="pill-link">🏛️ Hakkımızda</a>
            </div>
        </div>

        <div class="primary-actions">
            <a href="/" class="btn btn-burgundy">🏛️ Ana Sayfaya Dön</a>
            <a href="javascript:history.back()" class="btn btn-outline">↩ Geri Dön</a>
        </div>
    </div>
</body>
</html>
